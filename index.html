<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lucky 7 Slots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #241433;
    --cream: #fff6df;
    --yellow: #ffd23f;
    --pink: #ff5c8a;
    --cyan: #4de1ff;
    --green: #3ddc84;
    --purple: #7b4cff;
    --red: #ff4d5e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Jua', system-ui, sans-serif; color: var(--ink); user-select: none;
    background:
      radial-gradient(circle, rgba(255,255,255,.07) 2px, transparent 2.5px) 0 0 / 22px 22px,
      radial-gradient(circle at 50% 30%, #7a4be0 0%, #3d1f86 45%, #1d0e45 100%);
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }

  .card {
    background: var(--cream); border: 4px solid var(--ink); border-radius: 18px;
    box-shadow: 0 6px 0 var(--ink);
  }
  .btn {
    font: 18px 'Jua', sans-serif; color: var(--ink); background: var(--yellow);
    border: 4px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink);
    padding: 8px 16px; cursor: pointer; transition: transform .06s, box-shadow .06s;
  }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { filter: grayscale(.9); opacity: .55; cursor: not-allowed; }
  .btn.small { font-size: 15px; padding: 5px 12px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); }
  .hidden { display: none !important; }

  /* 퀘스트 */
  #questWrap { position: fixed; top: 14px; left: 14px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; z-index: 5; }
  #quest { width: 250px; padding: 10px 14px 12px; }
  #quest .qhead { font-size: 14px; display: flex; justify-content: space-between; opacity: .8; }
  #quest .qtext { font-size: 21px; margin: 2px 0 8px; }
  #quest .bar { height: 16px; border: 3px solid var(--ink); border-radius: 99px; background: #fff; overflow: hidden; }
  #quest .bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(-45deg, var(--green) 0 10px, #2fc070 10px 20px); transition: width .3s; }
  #quest .qnum { font: 16px 'Luckiest Guy', sans-serif; margin-top: 6px; letter-spacing: 1px; }
  #quest.done { animation: wiggle .6s ease-in-out 3; }
  @keyframes wiggle { 25% { transform: rotate(-4deg) scale(1.05); } 75% { transform: rotate(4deg) scale(1.05); } }
  #lives, #ngplus { font-size: 15px; padding: 4px 12px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); }
  #ngplus { background: #fff3b0; }

  #topbar { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 5; }
  #paytable { position: fixed; top: 66px; right: 14px; width: 250px; padding: 12px 16px; z-index: 5; }
  #paytable h3 { margin: 0 0 6px; font: 22px 'Luckiest Guy', sans-serif; text-align: center; letter-spacing: 1px; }
  #paytable table { width: 100%; border-collapse: collapse; font-size: 17px; }
  #paytable td { padding: 3px 0; }
  #paytable td:last-child { text-align: right; font-family: 'Luckiest Guy'; color: var(--red); }
  #paytable .bar7 { font: 13px 'Luckiest Guy'; background: var(--ink); color: #fff; border-radius: 5px; padding: 2px 5px; }
  #paytable .seven { font: 20px 'Luckiest Guy'; color: var(--red); }
  #paytable p { margin: 8px 0 0; font-size: 13px; opacity: .7; text-align: center; }

  /* 업적 */
  #achBtn { position: fixed; right: 14px; bottom: 14px; z-index: 5; }
  #achPanel {
    position: fixed; right: 14px; bottom: 72px; width: 300px; max-height: 60vh; overflow: auto;
    padding: 12px; z-index: 6; display: none;
  }
  #achPanel.open { display: block; }
  #achPanel h3 { margin: 0 0 4px; font: 22px 'Luckiest Guy'; text-align: center; }
  #achPanel .cnt { margin: 0 0 10px; font-size: 13px; text-align: center; opacity: .75; }
  .ach { display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 12px; margin-bottom: 6px; background: #fff; border: 3px solid var(--ink); }
  .ach .ic { font-size: 26px; width: 34px; text-align: center; }
  .ach b { display: block; font-weight: normal; font-size: 16px; }
  .ach small { font-size: 13px; opacity: .65; }
  .ach.locked { background: #e9e2d2; }
  .ach.locked .ic { filter: grayscale(1) brightness(.4); }
  #achPop {
    position: fixed; right: 14px; bottom: 76px; padding: 10px 16px; z-index: 30;
    display: flex; gap: 10px; align-items: center; transform: translateX(130%); transition: transform .35s cubic-bezier(.2,1.5,.4,1);
  }
  #achPop.show { transform: translateX(0); }
  #achPop .ic { font-size: 34px; }
  #achPop small { display: block; font-size: 13px; color: var(--purple); }
  #achPop b { font-weight: normal; font-size: 19px; }
  #achPop em { display: block; font-style: normal; font-size: 13px; opacity: .7; }
  #achPop.rare { background: linear-gradient(135deg, #fff3b0, #ffd6f0); animation: rareGlow .8s ease-in-out infinite; }
  #achPop.rare small { color: var(--pink); }
  @keyframes rareGlow { 50% { box-shadow: 0 6px 0 var(--ink), 0 0 26px 6px rgba(255,210,63,.8); } }
  .ach.rare:not(.locked) { background: linear-gradient(135deg, #fff3b0, #ffe4f4); }

  #autoBtn { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; }
  #autoBtn.on { background: var(--green); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 5px 0 var(--ink), 0 0 0 6px rgba(61,220,132,.35); } }
  #autoBtn:active { transform: translateX(-50%) translateY(4px); }

  #toast {
    position: fixed; left: 50%; bottom: 76px; transform: translate(-50%, 16px); padding: 8px 18px;
    font-size: 18px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; z-index: 20;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #hint { position: fixed; left: 0; top: 0; pointer-events: none; font-size: 19px; color: var(--yellow); -webkit-text-stroke: 1px var(--ink); text-shadow: 0 3px 0 var(--ink); white-space: nowrap; transition: opacity .4s; }
  #hint span { display: inline-block; animation: nudge 1s ease-in-out infinite; }
  #hint.hidden { display: block !important; opacity: 0; }
  @keyframes nudge { 50% { transform: translateY(8px); } }

  /* 당첨 연출 */
  #big { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 15; }
  #big .box { text-align: center; opacity: 0; }
  #big.show .box { animation: pop 3s cubic-bezier(.2, 1.5, .4, 1) forwards; }
  #big .t {
    font: clamp(52px, 13vw, 140px) 'Luckiest Guy', sans-serif; color: var(--yellow); line-height: 1;
    -webkit-text-stroke: 4px var(--ink); text-shadow: 0 8px 0 var(--ink), 0 0 40px rgba(255,210,63,.6);
    transform: rotate(-4deg);
  }
  #big.small .t { font-size: clamp(40px, 9vw, 90px); }
  #big.bad .t { color: #b04dff; }
  #big.bad .amt { color: #ff4d5e; }
  #big .sub { margin-top: 6px; font: 20px 'Jua', sans-serif; color: #fff; -webkit-text-stroke: 1px var(--ink); text-shadow: 0 3px 0 var(--ink); }
  #rays {
    position: fixed; inset: -50%; pointer-events: none; z-index: 12; opacity: 0;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,215,64,.35) 0 8deg, transparent 8deg 16deg);
  }
  #rays.go { animation: raysAnim 3.4s ease-out; }
  @keyframes raysAnim { 0% { opacity: 0; transform: rotate(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: rotate(50deg); } }
  #big .amt { margin-top: 8px; font: clamp(34px, 7vw, 70px) 'Luckiest Guy'; color: #fff; -webkit-text-stroke: 3px var(--ink); text-shadow: 0 6px 0 var(--ink); }
  @keyframes pop {
    0% { transform: scale(.2) rotate(-20deg); opacity: 0; }
    14% { transform: scale(1.15) rotate(3deg); opacity: 1; }
    22% { transform: scale(1) rotate(0); }
    85% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.2); opacity: 0; }
  }
  .rain { position: fixed; top: -60px; font-size: 34px; pointer-events: none; animation: fall linear forwards; z-index: 14; }
  @keyframes fall { to { transform: translateY(calc(100vh + 120px)) rotate(var(--r)); } }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 13; }
  #flash.go { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: .5; } 100% { opacity: 0; } }

  /* 짜잔! 숨겨진 상점 */
  #tada {
    position: fixed; inset: 0; z-index: 40; background: var(--cream); display: none;
    overflow-y: auto; padding: 40px 16px;
  }
  #tada.show { display: block; }
  #tada .rays {
    position: fixed; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; pointer-events: none;
    background: repeating-conic-gradient(rgba(255,210,63,.35) 0 10deg, transparent 10deg 20deg);
    animation: spin 30s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #tada .content { position: relative; max-width: 960px; margin: 0 auto; text-align: center; }
  #tada h1 {
    margin: 0; font: clamp(56px, 12vw, 120px) 'Luckiest Guy', 'Jua', sans-serif; color: var(--pink);
    -webkit-text-stroke: 4px var(--ink); text-shadow: 0 8px 0 var(--ink);
  }
  #tada.reveal h1 { animation: tadaIn .9s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes tadaIn { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
  #tada .sub { font-size: 24px; margin: 8px 0 4px; }
  #tada .wallet { display: inline-block; font: 22px 'Luckiest Guy'; padding: 6px 18px; margin: 10px 0 22px; background: var(--yellow); }
  #tada .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; text-align: left; }
  .up { padding: 14px; display: flex; flex-direction: column; gap: 6px; background: #fff; }
  #tada.reveal .up { animation: cardIn .5s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes cardIn { 0% { transform: translateY(40px) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .up .ic { font-size: 44px; line-height: 1; }
  .up h4 { margin: 0; font-size: 21px; font-weight: normal; }
  .up p { margin: 0; font-size: 15px; opacity: .75; flex: 1; }
  .up .pips { letter-spacing: 2px; font-size: 14px; color: var(--purple); }
  .up .btn { margin-top: 6px; width: 100%; }
  .up.locked { background: #ece5d4; }
  .up.locked .ic { filter: grayscale(1) brightness(.3); }
  #tadaClose { margin-top: 28px; font-size: 22px; padding: 10px 28px; background: var(--green); }

  #double {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 18;
    padding: 12px 16px; font-size: 18px; text-align: center; width: min(360px, calc(100vw - 32px));
  }
  #double b { color: var(--red); font-weight: normal; }
  #double .row { display: flex; gap: 8px; margin-top: 10px; }
  #double .row .btn { flex: 1; }
  #dblYes { background: var(--pink); color: #fff; }

  /* 사신 */
  #dark { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s; z-index: 2;
    background: radial-gradient(circle at 50% 45%, rgba(20,0,30,0) 25%, rgba(10,0,20,.92) 85%); }
  #dark.on { opacity: 1; }
  #bubble {
    position: fixed; left: 0; top: 0; max-width: 300px; padding: 12px 16px; z-index: 25;
    font-size: 20px; line-height: 1.35; white-space: pre-line; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #bubble.show { opacity: 1; pointer-events: auto; }
  #bubble::after {
    content: ''; position: absolute; left: -16px; top: 22px; border: 10px solid transparent;
    border-right: 14px solid var(--ink);
  }
  #bubble .choices { display: flex; gap: 8px; margin-top: 10px; }
  #bubble .choices .btn { flex: 1; font-size: 18px; padding: 8px 6px; }
  #slash {
    position: fixed; left: -10vw; top: 50%; width: 120vw; height: 16px; z-index: 26; pointer-events: none;
    background: linear-gradient(#fff, #fff) center / 100% 30% no-repeat, #ff2040;
    border-radius: 99px; transform: rotate(-24deg) scaleX(0); opacity: 0;
    box-shadow: 0 0 30px #ff2040;
  }
  #slash.go { animation: slash .7s ease-out forwards; }
  @keyframes slash { 0% { transform: rotate(-24deg) scaleX(0); opacity: 1; } 25% { transform: rotate(-24deg) scaleX(1); opacity: 1; } 100% { transform: rotate(-24deg) scaleX(1); opacity: 0; } }
  #death {
    position: fixed; inset: 0; z-index: 50; background: #000; display: grid; place-items: center;
    opacity: 0; pointer-events: none; transition: opacity 1.2s;
  }
  #death.show { opacity: 1; pointer-events: auto; }
  #death .inner { text-align: center; color: #fff; padding: 16px; }
  #death h1 {
    margin: 0; font: clamp(60px, 14vw, 150px) 'Luckiest Guy'; color: var(--red);
    -webkit-text-stroke: 4px #fff; text-shadow: 0 8px 0 #5a0010;
  }
  #death.show h1 { animation: thud .8s cubic-bezier(.2,1.6,.4,1) .5s both; }
  @keyframes thud { 0% { transform: translateY(-200px) rotate(-10deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  #death p { font-size: 22px; margin: 10px 0; }
  #death .stats { font-size: 17px; opacity: .7; }
  #death .btn { margin-top: 16px; font-size: 22px; }

  #hospital { position: fixed; inset: 0; z-index: 55; background: #000; display: none; place-items: center; }
  #hospital.show { display: grid; }
  #hosCan { width: 100vw; height: 100vh; display: block; }
  #hosText {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(720px, calc(100vw - 32px));
    padding: 14px 20px; font-size: 21px; line-height: 1.4; min-height: 64px; opacity: 0; transition: opacity .3s;
  }
  #hosText.show { opacity: 1; }
  #hosEnd {
    position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px;
    background: rgba(10, 6, 20, .72); opacity: 0; pointer-events: none; transition: opacity 1.2s;
  }
  #hosEnd.show { opacity: 1; pointer-events: auto; }
  #hosEnd h1 {
    margin: 0; font: clamp(60px, 13vw, 140px) 'Luckiest Guy'; color: var(--yellow);
    -webkit-text-stroke: 4px var(--ink); text-shadow: 0 8px 0 var(--ink);
  }
  #hosEnd p { color: #fff; font-size: 18px; margin: 0 0 8px; }
  #hosEnd .btn { justify-self: center; font-size: 22px; }

  /* 모바일 조작 바 (터치 화면에서 3D 버튼 대신) */
  #mobBar { display: none; }
  @media (pointer: coarse), (max-width: 640px) {
    #mobBar {
      display: flex; position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 6; gap: 6px; padding: 6px; align-items: center; max-width: calc(100vw - 16px); transition: opacity .3s;
    }
    #mobBar.off { opacity: 0; pointer-events: none; }
    #mobBar .btn { font-size: 16px; padding: 8px 10px; min-width: 42px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); white-space: nowrap; }
    #mobBar [data-act=max] { background: var(--pink); color: #fff; }
    #mobBar [data-act=allin] { background: #b98cff; color: #fff; }
    #mobBar [data-act=spin] { background: var(--green); }
    #mobBar .mbet { text-align: center; min-width: 54px; line-height: 1; }
    #mobBar .mbet small { display: block; font-size: 11px; opacity: .6; }
    #mobBar .mbet b { font: 19px 'Luckiest Guy', sans-serif; font-weight: normal; color: var(--red); }
    #achBtn { bottom: calc(76px + env(safe-area-inset-bottom)); }
    #autoBtn, #autoBtn:active { left: 14px; bottom: calc(76px + env(safe-area-inset-bottom)); transform: none; }
    #toast, #double { bottom: calc(134px + env(safe-area-inset-bottom)); }
    #achPop, #achPanel { bottom: calc(134px + env(safe-area-inset-bottom)); }
    #achPanel { max-height: 50vh; }
  }
  @media (max-aspect-ratio: 1/1) {
    #hosText { bottom: auto; top: calc(18px + env(safe-area-inset-top)); font-size: 18px; }
  }
  @media (max-width: 400px) {
    #mobBar { gap: 4px; padding: 5px; }
    #mobBar .btn { font-size: 14px; padding: 7px 7px; min-width: 36px; }
    #mobBar .mbet { min-width: 44px; }
  }
  @media (max-width: 640px) {
    #quest { width: 200px; padding: 8px 10px 10px; }
    #quest .qtext { font-size: 17px; }
    #paytable { width: 220px; }
    .btn { font-size: 15px; padding: 6px 12px; }
    #achPanel { width: calc(100vw - 28px); }
    #tada h1 { -webkit-text-stroke: 3px var(--ink); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="dark"></div>

<div id="questWrap">
  <div id="quest" class="card">
    <div class="qhead"><span>📜 퀘스트</span><span id="qstep">1 / 4</span></div>
    <div class="qtext" id="qtext">200 코인을 버세요!</div>
    <div class="bar"><i id="qbar"></i></div>
    <div class="qnum" id="qnum">100 / 200</div>
  </div>
  <button id="shopBtn" class="btn small hidden">⬆️ 업그레이드</button>
  <div id="lives" class="card hidden"></div>
  <div id="ngplus" class="card hidden"></div>
</div>

<div id="topbar">
  <button class="btn small" id="payBtn">배당표</button>
  <button class="btn small" id="muteBtn">🔊</button>
</div>
<div id="paytable" class="card hidden"></div>

<button id="achBtn" class="btn small">🏆 업적</button>
<div id="achPanel" class="card"></div>
<div id="achPop" class="card"><div class="ic"></div><div><small>🏆 업적 달성!</small><b></b><em></em></div></div>

<button id="autoBtn" class="btn hidden">🤖 AUTO OFF</button>
<div id="mobBar" class="card">
  <button class="btn" data-act="down">−</button>
  <div class="mbet"><small>BET</small><b id="mBet">1</b></div>
  <button class="btn" data-act="up">+</button>
  <button class="btn" data-act="max">MAX</button>
  <button class="btn" data-act="allin">ALL IN</button>
  <button class="btn" data-act="spin">SPIN</button>
</div>
<div id="toast" class="card"></div>
<div id="hint"><span>⬇</span> 레버를 당겨요!</div>
<div id="flash"></div>
<div id="rays"></div>
<div id="big"><div class="box"><div class="t"></div><div class="amt"></div><div class="sub"></div></div></div>

<div id="double" class="card hidden">
  <div>😈 사신: "<b id="dblAmt"></b> 크레딧, 두 배로 불려볼 텐가?"</div>
  <div class="row"><button class="btn" id="dblYes">도전! ×2</button><button class="btn" id="dblNo">그냥 받기</button></div>
</div>
<div id="bubble" class="card"><div class="msg"></div><div class="choices hidden"></div></div>
<div id="slash"></div>

<div id="tada">
  <div class="rays"></div>
  <div class="content">
    <h1 id="tadaTitle">업그레이드</h1>
    <div class="sub" id="tadaSub">업그레이드가 열렸어요!</div>
    <div class="wallet card" id="tadaWallet"></div>
    <div class="cards" id="cards"></div>
    <button class="btn" id="tadaClose">계속 돌리기 ▶</button>
  </div>
</div>

<div id="hospital">
  <canvas id="hosCan" width="960" height="540"></canvas>
  <div id="hosText" class="card"></div>
  <div id="hosEnd">
    <h1>THE END</h1>
    <p id="hosBonus"></p>
    <button class="btn" id="hosRestart">다시 하기 ↻</button>
  </div>
</div>

<div id="death">
  <div class="inner">
    <h1>YOU DIED</h1>
    <p id="deathMsg">💀 사신에게 영혼을 빼앗겼다…</p>
    <p class="stats" id="deathStats"></p>
    <p class="stats" id="deathBonus"></p>
    <button class="btn" id="restart">다시 태어나기 ↻</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const mod = (a, n) => ((a % n) + n) % n;
const $ = (id) => document.getElementById(id);
const wait = (s) => new Promise(r => setTimeout(r, s * 1000));
const easeOutBack = (u) => 1 + 2.70158 * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2);
const easeInOut = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
const easeIn = (u) => u * u * u;

// 간단한 트윈 (프레임 루프에서 진행)
const tweens = [];
function tween(dur, fn, ease = (u) => u) {
  return new Promise(res => tweens.push({ t: 0, dur, fn, ease, res }));
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    const u = Math.min(1, tw.t / tw.dur);
    tw.fn(tw.ease(u));
    if (u >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}

const slotX = (i) => (i === 0 ? 0 : i % 2 ? -GAP * Math.ceil(i / 2) : (GAP + 0.6) * (i / 2));

function machineSlot(i, portrait, count) {
  if (i === 0) return { x: 0, y: 0, s: 1 };
  if (!portrait) return { x: slotX(i), y: 0, s: 1 };
  const k = i - 1, row = Math.floor(k / 2);
  const alone = k % 2 === 0 && k === count - 2;
  return { x: alone ? 0 : k % 2 ? 1.3 : -1.3, y: 5.8 + row * 3.4, s: 0.52 };
}

function shuffledStrip(base) {
  for (let tries = 0; tries < 2000; tries++) {
    const s = [...base];
    for (let i = s.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [s[i], s[j]] = [s[j], s[i]]; }
    if (s.every((v, i) => v !== s[(i + 1) % s.length])) return s;
  }
  return [...base];
}
// 와일드는 가운데 릴에만 (모든 릴에 넣으면 환수율 274% → 가운데만 + 절반 배당으로 113%)
function stripBase(reelIndex) {
  const s = [...BASE_STRIP];
  if (state.up.crown) s[s.indexOf('lemon')] = 'crown';
  if (state.up.bag) s[s.indexOf('bell')] = 'bag';
  if (state.up.trophy) s[s.indexOf('lemon')] = 'trophy';
  if (state.up.rainbow) s[s.indexOf('cherry')] = 'rainbow';
  if (state.up.ingot) s[s.indexOf('lemon')] = 'ingot';
  if (state.up.wild && reelIndex === 1) s[s.indexOf('bar')] = 'wild';
  if (state.cursed && reelIndex === 2) s[s.indexOf('cherry')] = 'death';
  return s;
}
const faceGeo = new THREE.PlaneGeometry(FACE_W, FACE_H);
const rimGeo = new THREE.CylinderGeometry(RR + 0.04, RR + 0.04, 0.03, 48);
class Reel {
  constructor(parent, x, index) {
    this.strip = shuffledStrip(stripBase(index));
    this.group = new THREE.Group();
    this.group.position.set(x, REEL_Y, REEL_Z);
    parent.add(this.group);
    this.faces = this.strip.map((sym, i) => {
      const pivot = new THREE.Group();
      pivot.rotation.x = -i * STEP;
      const tex = SYM_TEX[sym].sharp;
      const mat = noOutline(new THREE.MeshBasicMaterial({ map: tex }));
      const mesh = add(pivot, faceGeo, mat, 0, 0, APOTHEM);
      this.group.add(pivot);
      return { sym, mat, mesh };
    });
    for (const s of [-1, 1]) {
      const rim = add(this.group, rimGeo, noOutline(toon(0xffc93c)), s * (FACE_W / 2 + 0.016), 0, 0);
      rim.rotation.z = Math.PI / 2;
    }
    this.idx = Math.random() * N | 0;
    this.angle = this.idx * STEP;
    this.lastTick = this.idx;
    this.spinning = false;
    this.blur = false;
    this.bounceT = 9;
    this.teasing = false;
  }
  setSym(i, sym) {
    this.strip[i] = sym;
    const f = this.faces[i];
    f.sym = sym;
    f.mat.map = SYM_TEX[sym][this.blur ? 'blur' : 'sharp'];
  }
  // 목표 칸에 정확히 멈추도록 등속 구간 길이를 역산
  plan(target, stopTime) {
    this.angle = mod(this.angle, TAU);
    this.lastTick = Math.floor(this.angle / STEP + 0.5);
    const w = OMEGA, wind = 0.18, ta = 0.35, td = 0.6;
    const thA = w * ta / 2, thD = w * td / 2;
    const tc0 = Math.max(0.1, stopTime - wind - ta - td);
    const diff = mod(target * STEP - (this.angle + thA + w * tc0 + thD), TAU);
    const tc = tc0 + diff / w;
    this.p = { a0: this.angle, w, wind, ta, tc, td, thA, final: this.angle + thA + w * tc + thD, T: wind + ta + tc + td };
    this.idx = target;
    this.t = 0;
    this.spinning = true;
  }
  angleAt(t) {
    const p = this.p;
    if (t < p.wind) return p.a0 - 0.1 * Math.sin(Math.PI * t / p.wind);
    t -= p.wind;
    if (t < p.ta) return p.a0 + 0.5 * (p.w / p.ta) * t * t;
    t -= p.ta;
    if (t < p.tc) return p.a0 + p.thA + p.w * t;
    t -= p.tc;
    return p.a0 + p.thA + p.w * p.tc + p.w * t - 0.5 * (p.w / p.td) * t * t;
  }
  update(dt) {
    const prev = this.angle;
    if (this.spinning) {
      this.t += dt;
      if (this.t >= this.p.T) {
        this.angle = this.p.final;
        this.spinning = false;
        this.bounceT = 0;
        this.onStop?.();
      } else this.angle = this.angleAt(this.t);
    }
    const speed = Math.abs(this.angle - prev) / Math.max(dt, 1e-4);
    const blur = this.spinning && speed > 5;
    if (blur !== this.blur) {
      this.blur = blur;
      for (const f of this.faces) {
        f.mat.map = SYM_TEX[f.sym][blur ? 'blur' : 'sharp'];
      }
    }
    let off = 0;
    if (this.bounceT < 0.8) {
      this.bounceT += dt;
      off = 0.08 * Math.sin(this.bounceT * 30) * Math.exp(-this.bounceT * 9);
    }
    this.group.rotation.x = this.angle + off;
    const tick = Math.floor(this.angle / STEP + 0.5);
    if (tick !== this.lastTick) { this.lastTick = tick; if (this.spinning) sfx.reelTick(); }
  }
  get center() { return this.faces[this.idx]; }
}

        st.rotation.x = Math.PI / 2;
      }
    }
    this.ledWin(0);

    this.reels = REEL_X.map((rx, i) => new Reel(g, rx, i));
  }

  spin(delay, done) {
    const stops = this.reels.map(() => Math.random() * N | 0);
    const first = this.reels[0].strip[stops[0]];
    const luck = state.up.luck + LUCK_BONUS;
    if (first !== 'death') {   // 행운은 죽음의 코인을 따라가지 않음
      if (Math.random() < luck * 0.015) stops[1] = pickIndex(this.reels[1].strip, first);
      if (Math.random() < luck * 0.01) stops[2] = pickIndex(this.reels[2].strip, first);
    }
    const syms = stops.map((s, i) => this.reels[i].strip[s]);
    const teasing = syms[0] === syms[1];   // 앞 두 릴이 같으면 마지막 릴을 질질 끔
    const times = [1.3, 1.9, teasing ? 4.0 : 2.5].map(t => t + delay);
    this.mode = 'spin';
    this.ledWin(0);
    this.reels.forEach((r, i) => {
      r.plan(stops[i], times[i]);
      r.onStop = () => {
        sfx.reelStop();
        if (i === 1 && teasing) { sfx.startTease(); this.mode = 'tease'; this.reels[2].teasing = true; }
        if (i === 2) { this.reels[2].teasing = false; this.mode = 'spin'; done({ machine: this, syms }); }
      };
    });
  }
  setHighlight(cells, bad = false) {
    this.highlight = cells.map(i => this.reels[i].center);
    this.bad = bad;
  }
  clearHighlight() {
    for (const f of this.highlight) { f.mat.color.setRGB(1, 1, 1); f.mesh.scale.setScalar(1); }
    this.highlight = [];
  }
  update(t, dt) {
    this.reels.forEach(r => r.update(dt));
    const n = this.bulbs.length;
    this.bulbs.forEach((b, i) => {
      let on;
      switch (this.mode) {
        case 'spin': on = (i + Math.floor(t * 22)) % 4 === 0; break;
        case 'tease': on = Math.floor(t * 14) % 2 === 0; break;
        case 'win': on = (i + Math.floor(t * 7)) % 2 === 0; break;
        case 'jackpot': on = Math.sin(i * 12.9898 + Math.floor(t * 16) * 78.233) > 0; break;
        case 'dark': on = false; break;
        case 'cursed': on = Math.floor(t * 10) % 2 === 0; break;
        default: on = (i + Math.floor(t * 5)) % n % 4 < 2;
      }
      const purple = this.mode === 'cursed' || (state.cursed && i % 3 === 0);
      b.mat.color.copy(on ? (purple ? CURSE_COLOR : b.on) : b.off);
    });
    const winning = this.mode === 'win' || this.mode === 'jackpot';
    this.paylineMat.emissiveIntensity = winning ? 0.6 + 0.4 * Math.sin(t * 16) : 0.2;
    this.neonMat.emissiveIntensity = winning ? 0.5 + 0.3 * Math.sin(t * 10) : this.mode === 'tease' ? 0.4 + 0.3 * Math.sin(t * 20) : 0.15;
    for (const f of this.highlight) {
      const s = Math.sin(t * 10);
      const k = (s + 1) / 2;
      if (this.bad) f.mat.color.setRGB(0.85 + 0.25 * k, 0.55, 1.1 + 0.2 * k); // 보라색 = 마이너스
      else f.mat.color.setRGB(1 + 0.2 * k, 1 + 0.05 * k, 1 - 0.45 * k); // 금색으로 깜빡임
      f.mesh.scale.setScalar(1 + 0.04 * (s + 1));
    }
    for (const f of this.reels[2].faces) {
      if (this.reels[2].teasing) { const k = 0.5 + 0.5 * Math.sin(t * 18); f.mat.color.setRGB(1, 1 - 0.25 * k, 1 - 0.1 * k); }
      else if (!this.highlight.includes(f)) f.mat.color.setRGB(1, 1, 1);
    }
    if (this.sirenT > 0) {
      this.sirenT -= dt;
      this.domeMat.emissiveIntensity = 0.5 + 0.5 * Math.sin(t * 18);
    } else this.domeMat.emissiveIntensity = 0;
  }
}
function pickIndex(strip, sym) {

  return idx.length ? idx[Math.random() * idx.length | 0] : Math.random() * N | 0;
}

const audio = { ctx: null, master: null, noise: null, muted: false };
function ac() {
  if (!audio.ctx) {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const comp = c.createDynamicsCompressor();
    const m = c.createGain();
    m.gain.value = audio.muted ? 0 : 0.7;
    m.connect(comp).connect(c.destination);
    const buf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    Object.assign(audio, { ctx: c, master: m, noise: buf });
  }
  if (audio.ctx.state === 'suspended') audio.ctx.resume();
  return audio.ctx;
}
function env(g, t, vol, dur, attack = 0.003) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function osc({ f, f2 = 0, type = 'sine', dur = 0.2, vol = 0.2, at = 0, filter = 0 }) {
  const c = ac(), t = c.currentTime + at;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  env(g, t, vol, dur);
  let node = o;
  if (filter) { const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = filter; o.connect(fl); node = fl; }
  node.connect(g).connect(audio.master);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise({ dur = 0.05, vol = 0.2, freq = 2000, f2 = 0, q = 1, type = 'bandpass', at = 0 }) {
  const c = ac(), t = c.currentTime + at;
  const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
  s.buffer = audio.noise;
  fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(freq, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  env(g, t, vol, dur, 0.001);
  s.connect(fl).connect(g).connect(audio.master);
  s.start(t, Math.random() * 0.5, dur + 0.05);
}
function bell(f, at = 0, vol = 0.12, dur = 0.6) {
  [[1, 1], [2.76, 0.45], [5.4, 0.2]].forEach(([k, v]) => osc({ f: f * k, dur: dur / Math.sqrt(k), vol: vol * v, at }));
}
const loops = {};
function loop(name, build) {
  if (loops[name]) return;
  const c = ac(), g = c.createGain();
  g.gain.setValueAtTime(0.0001, c.currentTime);
  g.connect(audio.master);
  loops[name] = { g, nodes: build(c, g) };
}
function stopLoop(name, fade = 0.08) {
  const l = loops[name];
  if (!l) return;
  const t = audio.ctx.currentTime;
  l.g.gain.cancelScheduledValues(t);
  l.g.gain.setTargetAtTime(0.0001, t, fade);
  l.nodes.forEach(n => n.stop(t + fade * 8));
  delete loops[name];
}

  const mx = m.group.position.x, my = m.group.position.y, k = m.baseS || 1;
  const c = add(scene, coinGeo, coinMat, mx + rand(-0.35, 0.35) * k, my + 1.02 * k, 1.15 * k);

  c.rotation.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));

    m: c, mx, half: 1.36 * k, zmax: 1.8 * k, vel: new THREE.Vector3(rand(-0.7, 0.7), rand(0.1, 0.7), rand(1.0, 1.9)).multiplyScalar(Math.sqrt(k)),
    spin: new THREE.Vector3(rand(-12, 12), rand(-12, 12), rand(-12, 12)),
    rest: my + (0.5 + rand(0, 0.05)) * k, landed: false, bounces: 0,
  });

function updateCoins(dt) {
  for (const c of coins) {
    if (c.landed) continue;
    c.vel.y -= 9.8 * dt;
    c.m.position.addScaledVector(c.vel, dt);
    c.m.rotation.x += c.spin.x * dt; c.m.rotation.y += c.spin.y * dt; c.m.rotation.z += c.spin.z * dt;
    const p = c.m.position;
    if (Math.abs(p.x - c.mx) > c.half) { p.x = c.mx + Math.sign(p.x - c.mx) * c.half; c.vel.x *= -0.4; }
    if (p.z > c.zmax) { p.z = c.zmax; c.vel.z *= -0.35; }
    if (p.y <= c.rest) {
      p.y = c.rest;
      if (c.bounces < 2 && c.vel.y < -1) {
        c.bounces++;
        c.vel.y *= -0.32; c.vel.x *= 0.5; c.vel.z *= 0.5; c.spin.multiplyScalar(0.4);
        sfx.coin();
      } else {
        c.landed = true;
        c.m.rotation.set(rand(-0.15, 0.15), rand(0, TAU), rand(-0.15, 0.15));
      }
    }
  }
}

function drawReaper(t) {

function updateReaper(t, dt) {
  rbody.position.y = 0.12 * Math.sin(t * 2.2);

  RA.talk -= dt;
  RA.blinkT -= dt;
  if (RA.blinkT <= 0) { RA.blinkPh = 0; RA.blinkT = rand(1.8, 4.2); }
  if (RA.blinkPh >= 0) {
    RA.blinkPh += dt;
    RA.blink = Math.sin(Math.min(1, RA.blinkPh / 0.16) * Math.PI);
    if (RA.blinkPh > 0.16) { RA.blinkPh = -1; RA.blink = 0; }
  }
  // 시선: 평소엔 살짝 두리번, 동전을 던지면 동전을 따라감
  let lx = Math.sin(t * 0.7) * 6, ly = Math.sin(t * 0.9) * 3 + 4;
  if (RA.lookMode === 'coin') { lx = 12; ly = clamp(10 - (coin.position.y - COIN_HOME.y) * 14, -20, 12); }
  const k = Math.min(1, dt * 14);
  RA.look.x += (lx - RA.look.x) * k;
  RA.look.y += (ly - RA.look.y) * k;
  RA.squash *= Math.exp(-dt * 7);
  RA.smear *= Math.exp(-dt * 5);
  drawReaper(t);
}

function drawCoinArt(x, cx, cy, r, kind, squash = 1) {

  }

  x.lineWidth = 5; x.strokeStyle = '#a76807'; x.stroke();
  x.fillStyle = '#b8770c';

  const emboss = (path) => {
    x.save(); x.translate(4, 5); path(); x.fillStyle = 'rgba(110,60,0,.5)'; x.fill(); x.restore();
    x.save(); x.translate(-2, -2); path(); x.fillStyle = 'rgba(255,250,220,.95)'; x.fill(); x.restore();
    path(); x.fillStyle = '#eeb52c'; x.fill();
  };
  const deep = '#6e4304';
  if (kind === 'heads') {
    emboss(() => { x.beginPath(); x.ellipse(0, -14, 54, 50, 0, 0, TAU); x.roundRect(-32, 8, 64, 46, 16); });
    x.fillStyle = deep;
    for (const ex of [-21, 21]) { x.beginPath(); x.ellipse(ex, -14, 15, 18, ex < 0 ? 0.15 : -0.15, 0, TAU); x.fill(); }
    x.beginPath(); x.moveTo(0, 6); x.lineTo(-7, 18); x.lineTo(7, 18); x.closePath(); x.fill();
    x.strokeStyle = deep; x.lineWidth = 4; x.beginPath();

    x.stroke();
    x.fillStyle = 'rgba(255,250,220,.8)';
    for (const ex of [-25, 17]) { x.beginPath(); x.arc(ex, -20, 3.5, 0, TAU); x.fill(); }
  } else {
    const star = (R, r0) => {
      x.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? r0 : R, a = -Math.PI / 2 + (i * Math.PI) / 5;
        x.lineTo(rr * Math.cos(a), rr * Math.sin(a) + 4);
      }
      x.closePath();
    };
    emboss(() => star(66, 28));
    // 면을 나눈 각진 별 (반쪽씩 그늘)
    x.fillStyle = 'rgba(160,95,0,.35)';
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5, b = a + Math.PI / 5;
      x.beginPath(); x.moveTo(0, 4); x.lineTo(66 * Math.cos(a), 66 * Math.sin(a) + 4); x.lineTo(28 * Math.cos(b), 28 * Math.sin(b) + 4); x.closePath(); x.fill();
    }
    x.fillStyle = 'rgba(255,250,220,.9)';
    for (const [sx, sy, sr] of [[-62, -52, 9], [60, 50, 7], [-56, 58, 5]]) {
      x.beginPath(); x.moveTo(sx, sy - sr); x.lineTo(sx + sr * 0.3, sy - sr * 0.3); x.lineTo(sx + sr, sy); x.lineTo(sx + sr * 0.3, sy + sr * 0.3);

    }

}

const puffs = [];
function smoke(n, y = 0.2) {
  for (let i = 0; i < n; i++) {
    const m = add(scene, new THREE.SphereGeometry(rand(0.3, 0.6), 12, 8),
      noOutline(new THREE.MeshBasicMaterial({ color: 0x8a5cff, transparent: true, opacity: 0.7, depthWrite: false })),
      reaper.position.x + rand(-1.2, 1.2), y + rand(0, 0.6), reaper.position.z + rand(-0.8, 0.8));
    puffs.push({ m, t: 0, life: rand(0.8, 1.4), vy: rand(0.4, 1.2) });
  }
}
function puffAt(pos, n) {
  for (let i = 0; i < n; i++) {
    const m = add(scene, new THREE.SphereGeometry(rand(0.25, 0.5), 12, 8),
      noOutline(new THREE.MeshBasicMaterial({ color: 0x8a5cff, transparent: true, opacity: 0.7, depthWrite: false })),
      pos.x + rand(-0.8, 0.8), pos.y + rand(-0.5, 0.5), pos.z + rand(-0.2, 0.3));
    puffs.push({ m, t: 0, life: rand(0.6, 1.1), vy: rand(0.4, 1.2) });
  }
}
function updatePuffs(dt) {
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.t += dt;
    const u = p.t / p.life;
    p.m.position.y += p.vy * dt;
    p.m.scale.setScalar(1 + u * 1.5);
    p.m.material.opacity = 0.7 * (1 - u);
    if (u >= 1) { scene.remove(p.m); puffs.splice(i, 1); }
  }
}

// 죽음의 코인은 와일드처럼 줄을 맞춰주지만 당첨금이 마이너스
function evaluate(syms) {
  const deaths = syms.filter(s => s === 'death').length;
  const rest = syms.filter(s => s !== 'wild' && s !== 'death');
  if (rest.every(s => s === rest[0])) {
    const sym = rest[0] || 'seven';   // 와일드·죽음만으로 된 줄은 7로 취급
    const wild = rest.length < 3;
    return { kind: 'triple', mult: SYMS[sym].pay * (wild && !deaths ? 0.5 : 1), cells: [0, 1, 2], sym, wild, death: deaths > 0 };
  }
  const ch = syms.map((s, i) => (s === 'cherry' ? i : -1)).filter(i => i >= 0);
  if (ch.length === 2) return { kind: 'cherry2', mult: TWO_CHERRY, cells: ch, sym: 'cherry' };
  if (syms[0] === syms[1]) return { kind: 'pair', mult: PAIR_MULT, cells: [0, 1], sym: syms[0] };
  if (ch.length === 1 && (state.up.cherry || ch[0] === 0)) return { kind: 'cherry1', mult: ONE_CHERRY, cells: ch, sym: 'cherry' };
  return null;
}

// ---------- 당첨 희귀도: 지금 기계 구성(릴·행운)에서 그 줄이 나올 확률을 정확히 계산 ----------
const evKey = (ev) => `${ev.kind}:${ev.sym}:${ev.wild ? 1 : 0}:${ev.death ? 1 : 0}`;
function computeOdds(m) {
  const S = m.reels.map(r => r.strip);
  const L = state.up.luck + LUCK_BONUS, p2 = L * 0.015, p3 = L * 0.01;
  const reelOpts = (strip, first, pf) => {
    const follow = first !== 'death';
    const opts = strip.map(sym => [sym, (follow ? 1 - pf : 1) / N]);
    if (follow) {
      if (strip.includes(first)) opts.push([first, pf]);
      else strip.forEach(sym => opts.push([sym, pf / N]));   // pickIndex 실패 시 무작위
    }
    return opts;
  };
  const odds = {};
  for (const a of S[0]) {
    for (const [b, pb] of reelOpts(S[1], a, p2)) {
      for (const [c, pc] of reelOpts(S[2], a, p3)) {
        const ev = evaluate([a, b, c]);
        if (ev) { const k = evKey(ev); odds[k] = (odds[k] || 0) + pb * pc / N; }
      }
    }
  }
  return odds;
}
function lineLabel(ev) {
  const e = ev.sym === 'seven' ? '7' : ev.sym === 'bar' ? 'BAR' : SYMS[ev.sym].emoji;
  return ev.kind === 'cherry1' ? '🍒' : ev.kind === 'cherry2' ? '🍒🍒' : ev.kind === 'pair' ? `${e} ${e}` : `${e} ${e} ${e}`;
}
const oddsText = (p) => (p >= 0.1 ? `${Math.round(p * 100)}%` : `1/${Math.round(1 / p).toLocaleString()}`);
const rarityTier = (p) => (p >= 0.1 ? 0 : p >= 0.03 ? 1 : p >= 0.008 ? 2 : p >= 0.002 ? 3 : 4);
const TIER_TITLE = ['NICE', 'WIN!', 'BIG WIN!', 'SUPER WIN!!', 'JACKPOT!!!'];
function celebrate(tier, total, sub) {
  showBig(TIER_TITLE[tier], total, tier <= 1, false, sub);
  if (tier === 0) { bell(1568, 0, 0.1, 0.4); return; }
  sfx.win();
  if (tier >= 2) { flash(); coinRain([0, 0, 20, 40, 80][tier]); state.shake = [0, 0, 0.3, 0.7, 1.3][tier]; sfx.bigWin(); }
  if (tier >= 3) sfx.alarm(tier === 4 ? 3 : 1.5);
  if (tier === 4) { const r = $('rays'); r.classList.remove('go'); void r.offsetWidth; r.classList.add('go'); }
}

const pay = { remaining: 0, step: 1, interval: 0.1, timer: 0, ticks: 0, sources: [] };
function finishSpin(results, bet) {
  let total = 0, tier = -1, sub = '';
  for (const r of results) {
    const ev = evaluate(r.syms);
    const p = ev ? computeOdds(r.machine)[evKey(ev)] || 1 : 1;
    if (!ev) { r.machine.mode = 'idle'; continue; }
    const amount = ev.death
      ? -Math.ceil(ev.mult * bet * DEATH_MUL)
      : Math.floor(ev.mult * bet * (state.up.golden ? 1.5 : 1) * PAY_BONUS);
    total += amount;
    r.amount = amount;
    r.machine.setHighlight(ev.cells, amount < 0);
    const t = rarityTier(p);
    r.machine.mode = amount < 0 ? 'cursed' : t >= 3 ? 'jackpot' : 'win';
    if (r.machine !== main) r.machine.ledWin(amount);
    if (ev.death) {
      unlock('death_hit');
      if (amount <= -10000) unlock('death_big');

    }
    if (t > tier) { tier = t; sub = `${lineLabel(ev)} · 확률 ${oddsText(p)}`; }
    if (ev.kind === 'cherry1') unlock('hit_cherry1');
    else if (ev.kind === 'cherry2') unlock('hit_cherry2');
    else if (ev.kind === 'pair') unlock('hit_pair');
    else if (!ev.wild) unlock({ seven: 'jackpot', crown: 'crown' }[ev.sym] || `hit_${ev.sym}`);
    if (ev.wild) unlock('wild');

  }
  if (state.allIn) {
    if (total) unlock('allin_win');
    state.allIn = false;
    state.bet = state.prevBet;
  }
  if (!total) {
    state.streak = 0;
    toIdle();
    return;

  if (total > 0) {
    state.streak++;

    for (let s = 2; s <= Math.min(5, state.streak); s++) unlock(`streak${s}`);
    if (state.streak >= 2) toast(`🔥 ${state.streak}연속 당첨!`);
  } else state.streak = 0;

  state.phase = 'paying';
  const abs = Math.abs(total);
  Object.assign(pay, {
    sign: Math.sign(total),
    remaining: abs,
    step: Math.max(1, Math.ceil(abs / 60)),
    timer: 0, ticks: 0,
    coinsLeft: total > 0 ? Math.min([8, 15, 30, 50, 80][Math.max(0, tier)], total) : 0,
    sources: results.filter(r => r.amount > 0).map(r => r.machine),
  });
  pay.interval = clamp(2.4 / Math.ceil(abs / pay.step), 0.04, 0.13);

  const lost = results.reduce((a, r) => a + Math.min(0, r.amount || 0), 0);
  if (total < 0) {
    state.shake = 0.6;
    sfx.sad(); sfx.laugh();

    showBig('OUCH!', total, false, true);
    return;
  }
  if (lost) toast(`💀 죽음의 코인 ${lost.toLocaleString()}`);
  // 한 번에 지갑을 두 배 이상 불리면 한 단계 더 화려하게
  if (total >= state.credits) tier = Math.min(4, tier + 1);
  celebrate(Math.max(0, tier), total, sub);
}

function updatePayout(dt) {
  if (state.phase !== 'paying') return;
  pay.timer += dt;
  while (pay.timer >= pay.interval && pay.remaining > 0) {
    pay.timer -= pay.interval;
    const n = Math.min(pay.step, pay.remaining);
    pay.remaining -= n;
    if (pay.sign > 0) {
      state.credits += n;
      state.win += n;
      sfx.countTick(pay.ticks++);
      for (let k = 0; k < n && pay.coinsLeft > 0; k++, pay.coinsLeft--) spawnCoin(pay.sources[pay.ticks % pay.sources.length]);
    } else {
      state.credits = Math.max(0, state.credits - n);
      state.win -= n;
      sfx.drain();
    }
  }
  renderHUD();
  if (pay.remaining === 0) {
    toIdle();
    setTimeout(() => { if (state.phase === 'idle') machines.forEach(m => { if (m.mode !== 'idle') m.mode = 'idle'; }); }, 2500);
  }
}

function toIdle() {
  state.phase = 'idle';

  if (state.credits >= MILLION) unlock('millionaire');
  if (!state.cursed && state.credits >= DEATH_GOAL) { deathCoinEvent(); return; }
  if (state.cursed && state.credits >= BILLION) { billionaireEnding(); return; }
  if (checkQuest()) return;
  if (state.credits <= 0) setTimeout(reaperEncounter, 700);
  else if (state.up.double && state.win > 0 && !state.auto) offerDouble(state.win);
}

let lastBeep = 0;

  drawHospital(t);

}

    resetCoin();
    RA.mood = 'smug';
    await say(`${amount.toLocaleString()} 크레딧을 걸었다.\n앞이냐 뒤냐?`);
  }
  await reaperLeave();
  sfx.stopDrone();
  setDark(false);
  cam.mode = 'normal';
  state.win = 0;
  toIdle();
}

// ---------- 사신 이벤트 ----------
const bubble = $('bubble');
let bubbleChoice = null;
function reaperLaugh() { sfx.laugh(); RA.laughT = 1.3; }
function say(text, hold = 0) {
  RA.talk = Math.max(0.8, text.length * 0.06);
  bubble.querySelector('.msg').textContent = text;
  bubble.querySelector('.choices').classList.add('hidden');
  bubble.classList.add('show');
  sfx.pop();
  return wait(hold);
}
function askChoice(text, options) {
  if (text) say(text);
  const box = bubble.querySelector('.choices');
  box.innerHTML = options.map(([id, label]) => `<button class="btn" data-c="${id}">${label}</button>`).join('');
  box.classList.remove('hidden');
  return new Promise(res => { bubbleChoice = res; });
}
const askCoin = () => askChoice(null, [['heads', '💀 앞면'], ['tails', '⭐ 뒷면']]);
// 플레이어가 고른 면이 나올 확률 = REAPER_FLIP_WIN (60%)
function flipResult(guess, winChance = REAPER_FLIP_WIN) {
  const other = guess === 'heads' ? 'tails' : 'heads';
  return Math.random() < winChance ? guess : other;
}
bubble.addEventListener('click', (e) => {
  const c = e.target.closest('[data-c]')?.dataset.c;
  if (!c || !bubbleChoice) return;
  sfx.click();
  bubble.querySelector('.choices').classList.add('hidden');
  const r = bubbleChoice; bubbleChoice = null;
  r(c);
});
const cam = { mode: 'normal', pos: new THREE.Vector3(0, 4, 14), look: new THREE.Vector3(0, 3.3, 0), fall: 0 };
const baseLight = { hemi: hemi.intensity, key: key.intensity };

function setDark(on) {
  $('dark').classList.toggle('on', on);
  machines.forEach(m => (m.mode = on ? 'dark' : 'idle'));
  tween(1.2, u => {
    const k = on ? u : 1 - u;
    hemi.intensity = baseLight.hemi * (1 - 0.7 * k);
    key.intensity = baseLight.key * (1 - 0.75 * k);
    reaperLight.intensity = 6 * k;
  });
}
async function reaperAppear() {
  reaper.visible = true;
  reaper.position.y = -4.5;
  resetCoin();
  Object.assign(RA, { mood: 'smug', scythe: 0, smear: 0, facepalm: 0, lookMode: 'player' });
  smoke(16);
  sfx.whoosh();
  await tween(1.4, u => { reaper.position.y = -4.5 + 4.5 * u; RA.squash = 0.14 * (1 - u); }, easeOutBack);
  RA.squash = -0.12;   // 착지하며 찌그러짐
  reaperLaugh();
}
async function reaperLeave() {
  bubble.classList.remove('show');
  smoke(16);
  sfx.whoosh();
  await tween(1.0, u => (reaper.position.y = -4.5 * u), easeIn);
  reaper.visible = false;
}
async function tossCoin(result) {
  resetCoin();
  RA.lookMode = 'coin';
  await tween(0.25, u => (RA.dip = 14 * u), easeInOut);   // 손을 살짝 내렸다가
  sfx.coinToss();
  cam.mode = 'coin';
  const start = coin.rotation.x;
  const end = Math.PI / 2 + TAU * 9 + (result === 'heads' ? 0 : Math.PI);
  await tween(2.2, u => {
    const p = u + 0.85 * Math.sin(TAU * u) / TAU;   // 꼭대기에서 슬로모션
    RA.dip = 14 * Math.max(0, 1 - u * 6);
    coin.position.set(COIN_HOME.x, COIN_HOME.y + 2.6 * 4 * p * (1 - p), COIN_HOME.z);
    coin.rotation.x = start + (end - start) * p;
  });
  // 탁! 잡아서 주먹 속에 숨김
  coin.visible = false;
  RA.hand = 1;
  RA.squash = 0.06;
  state.shake = 0.15;
  sfx.slap();
  await tween(0.2, u => (RA.dip = 10 * (1 - u)));
  RA.lookMode = 'player';
  say('자... 운명의 시간이다.');
  sfx.drumroll(1.8);
  await wait(1.9);
  // 손을 펼쳐 공개
  coin.rotation.set(result === 'heads' ? Math.PI / 2 : -Math.PI / 2, 0, 0);
  coin.visible = true;
  RA.hand = 0;
  RA.lookMode = 'coin';
  sfx.reveal();
  flash('radial-gradient(circle, rgba(255,240,180,.7), rgba(255,210,63,0) 60%)');
  await tween(0.45, u => {
    coin.position.set(COIN_HOME.x, COIN_HOME.y + 0.3 * u, COIN_HOME.z + 0.35 * u);
    coin.scale.setScalar(1 + 0.8 * u);
  }, easeOutBack);
  await wait(0.9);
  cam.mode = 'reaper';
}
async function reaperEncounter() {
  if (state.phase !== 'idle' || state.credits > 0 || state.shopOpen) return;
  state.phase = 'reaper';
  state.auto = false;
  updateAutoBtn();
  $('hint').classList.add('hidden');
  unlock('reaper');
  state.met = true;
  renderHUD();
  sfx.startDrone();
  setDark(true);
  cam.mode = 'reaper';
  await wait(0.6);
  await reaperAppear();

  if (state.lives > 0) {
    state.lives--;
    renderHUD();
    RA.facepalm = restarts >= 20 ? 1 : 0;
    await say(restarts >= 20 ? '또 너냐...\n지긋지긋하다..'
      : restarts >= 10 ? '...또 왔군.\n질리지도 않나 보지?'
      : '크크크... 빈털터리가 됐군.', 2.2);
    RA.facepalm = 0;
    await say('마지막 기회를 주지.\n이 동전, 앞이냐 뒤냐?');
    const guess = await askCoin();
    await say(guess === 'heads' ? '앞면이라... 어디 보자.' : '뒷면이라... 어디 보자.');
    const result = flipResult(guess);
    await tossCoin(result);
    await say(result === 'heads' ? '💀 앞면!' : '⭐ 뒷면!', 1.3);
    if (guess === result) {
      unlock('reaper_win');
      RA.mood = 'shock';
      await wait(0.8);
      RA.mood = 'grumble';
      sfx.grumble();
      await say('칫... 운이 좋군.\n마지막 10 크레딧이다. 다음엔 없다!', 2.8);
      state.credits += 10;
      state.revived = true;
      for (let i = 0; i < 10; i++) setTimeout(() => spawnCoin(main), i * 90);
      renderHUD();
      await reaperLeave();
      sfx.stopDrone();
      setDark(false);
      cam.mode = 'normal';
      state.phase = 'idle';
      renderHUD();
    } else {
      reaperLaugh();
      await say('틀렸다! 크하하하!', 1.4);
      await deathSequence();
    }
  } else {
    await say('약속대로...\n데리러 왔다.', 2.4);
    await deathSequence();
  }
}
async function deathSequence(final = false) {
  RA.mood = 'angry';
  bubble.classList.remove('show');
  await tween(0.55, u => (RA.scythe = -0.7 * u), easeInOut);
  sfx.whoosh();
  await tween(0.16, u => { RA.scythe = -0.7 + 2.6 * u; RA.smear = 1; });
  sfx.slash();
  const sl = $('slash');
  sl.classList.remove('go'); void sl.offsetWidth; sl.classList.add('go');
  flash('radial-gradient(circle, rgba(255,40,60,.8), rgba(120,0,20,.6))');
  state.shake = 0.6;
  unlock('died');
  await wait(0.4);
  cam.mode = 'death';
  [0, 0.9, 2.0].forEach(at => sfx.heartbeat(at));
  await tween(1.8, u => (cam.fall = u), easeIn);
  sfx.stopDrone();
  $('deathStats').textContent = `최고 크레딧 ${state.best.toLocaleString()} · ${state.spins}번 돌림 · 퀘스트 ${state.questIdx}/${QUESTS.length} · 지금까지 ${restarts}번 다시 시작`;
  if (final) {
    $('deathMsg').textContent = '💸 억만장자의 최후… 십억 코인도, 영혼도 사신의 것이 되었다.';
    $('deathBonus').textContent = endingBonusText();
    $('restart').textContent = '다시 하기 ↻';
  }
  $('death').classList.add('show');
}

// ---------- 레버 ----------
const lever = { angle: 0, vel: 0, dragging: false, triggered: false, auto: false, startY: 0, startAngle: 0, span: 200, tick: 0 };
function leverBallWorld(a) {
  return new THREE.Vector3(PIVOT.x, PIVOT.y + (LEVER_LEN + 0.14) * Math.cos(a), PIVOT.z + (LEVER_LEN + 0.14) * Math.sin(a));
}
function toScreen(v) {
  const p = v.clone().project(camera);
  return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight };
}
function leverFullyPulled() {
  if (lever.triggered) return;
  lever.triggered = true;
  sfx.clunk();
  if (!state.pulled) { state.pulled = true; $('hint').classList.add('hidden'); }
  startSpin();
}
function autoPull() {
  if (lever.dragging || lever.auto || state.phase !== 'idle' || state.shopOpen) return;
  lever.auto = true;
  lever.triggered = false;
}
function updateLever(dt) {
  if (lever.auto) {
    lever.angle = Math.min(LEVER_MAX, lever.angle + 9 * dt);
    if (lever.angle >= LEVER_MAX) { lever.auto = false; leverFullyPulled(); lever.vel = 0; }
  } else if (!lever.dragging) {
    lever.vel += (-70 * lever.angle - 7 * lever.vel) * dt;
    lever.angle += lever.vel * dt;
    if (lever.angle < 0) {
      if (lever.vel < -2) sfx.ratchet();
      lever.angle = 0; lever.vel *= -0.25;
    }
    if (lever.angle < 0.3) lever.triggered = false;
  }
  leverPivot.rotation.x = lever.angle;
  const tick = Math.floor(lever.angle / 0.2);
  if (tick !== lever.tick) { lever.tick = tick; sfx.ratchet(); }
}

// ---------- 포인터 ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return raycaster.intersectObjects(interactive, false)[0]?.object.userData.action;
}
let mouse = { x: 0, y: 0 };
const cv = renderer.domElement;
const blocked = () => state.phase === 'reaper' || state.shopOpen;
cv.addEventListener('pointerdown', (e) => {
  ac();
  if (blocked()) return;
  const action = pick(e);
  if (action === 'lever' && !lever.auto) {
    lever.dragging = true;
    lever.startY = e.clientY;
    lever.startAngle = lever.angle;
    lever.span = Math.max(80, Math.abs(toScreen(leverBallWorld(LEVER_MAX)).y - toScreen(leverBallWorld(0)).y));
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = 'grabbing';
  } else if (action) pressButton(action);
});
cv.addEventListener('pointermove', (e) => {
  mouse = { x: e.clientX / innerWidth - 0.5, y: e.clientY / innerHeight - 0.5 };
  if (lever.dragging) {
    lever.angle = clamp(lever.startAngle + (e.clientY - lever.startY) / lever.span * LEVER_MAX, 0, LEVER_MAX);
    lever.vel = 0;
    if (lever.angle >= LEVER_TRIGGER) leverFullyPulled();
    return;
  }
  const a = blocked() ? null : pick(e);
  cv.style.cursor = a === 'lever' ? 'grab' : a ? 'pointer' : 'default';
});
const endDrag = () => { if (lever.dragging) { lever.dragging = false; cv.style.cursor = 'default'; } };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// BET ± 단위: 최대 베팅이 커질수록 1 → 10 → 100 → 1,000
function betStep() {
  const max = BET_CAPS[state.up.betcap];
  return max <= 20 ? 1 : max <= 250 ? 10 : max <= 1000 ? 100 : 1000;
}
function changeBet(dir) {
  if (state.phase !== 'idle') return;
  const max = BET_CAPS[state.up.betcap], step = betStep();
  const next = dir > 0 ? (Math.floor(state.bet / step) + 1) * step : (Math.ceil(state.bet / step) - 1) * step;
  state.bet = clamp(next, 1, max);
  renderHUD();
}
function pressButton(id) {
  buttons[id].press = 0.15;
  sfx.click();
  if (id === 'down') changeBet(-1);
  else if (id === 'up') changeBet(1);
  else if (id === 'max') {
    if (state.phase !== 'idle') return;
    state.bet = BET_CAPS[state.up.betcap];
    renderHUD();
    autoPull();
  } else if (id === 'allin') {
    if (state.phase !== 'idle' || state.credits <= 0 || state.allIn) return;
    state.prevBet = state.bet;
    state.bet = Math.max(1, Math.floor(state.credits / machines.length));
    state.allIn = true;
    toast(`💥 ALL IN! ${state.bet * machines.length} 크레딧!`);
    sfx.whoosh();
    renderHUD();
    autoPull();
  } else if (id === 'spin') autoPull();
}
$('mobBar').addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  ac();
  if (act && !blocked()) pressButton(act);
});
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'Escape' && state.shopOpen) closeShop();
  if (blocked()) return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); ac(); autoPull(); }
  if (e.code === 'ArrowUp') { ac(); pressButton('up'); }
  if (e.code === 'ArrowDown') { ac(); pressButton('down'); }
});

// ---------- 카메라 / 루프 ----------
// 세로 화면 선반 (위층 기계 받침)
const shelves = [];
function layoutShelves(portrait) {
  const rows = portrait ? Math.ceil((machines.length - 1) / 2) : 0;
  while (shelves.length < rows) shelves.push(add(scene, rbox(5.2, 0.12, 1.5, 0.05), M.gold, 0, 0, 0));
  shelves.forEach((sh, r) => {
    sh.visible = r < rows;
    sh.position.set(0, 5.8 + r * 3.4 - 0.07, -0.3);
  });
}
let fitDist = 14;
const focus = new THREE.Vector3(0.35, 3.25, 0);
function fitCamera() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const v = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const portrait = camera.aspect < 0.8;
  machines.forEach((m, i) => {
    const p = machineSlot(i, portrait, machines.length);
    m.group.position.set(p.x, p.y, 0);
    m.baseS = p.s;
    if (!m.popping) m.group.scale.setScalar(p.s);
  });
  layoutShelves(portrait);
  const ext = machines.map(m => [m.group.position.x - 2.3 * m.baseS, m.group.position.x + (m.main ? 3.0 : 2.3) * m.baseS]);
  const left = Math.min(...ext.map(e => e[0])), right = Math.max(...ext.map(e => e[1]));
  const top = Math.max(...machines.map(m => m.group.position.y + MACHINE_TOP * m.baseS));
  // 가장자리 기계는 원근 때문에 더 크게 보여서 넓을수록 여유를 더 줌
  const width = (right - left) * (machines.length > 1 && !portrait ? 1.1 : 1) + (camera.aspect < 0.85 ? 1.3 : 1.2);
  // 모바일 조작 바가 있는 가로 화면이면 아래쪽 자리를 비워 둠
  const bar = camera.aspect > 1 && getComputedStyle($('mobBar')).display !== 'none' ? 1 : 0;
  const extra = top - MACHINE_TOP;
  fitDist = Math.max((8.4 + 1.4 * bar + extra) / v, width / (v * camera.aspect));
  focus.set((left + right) / 2, 3.25 - 0.7 * bar + extra / 2, 0);
  stage.position.x = stageRing.position.x = focus.x;
  const sx = (right - left) / 2 / 3.6 + 0.15;
  stage.scale.x = stageRing.scale.x = Math.max(1, sx);
}
addEventListener('resize', fitCamera);
fitCamera();
cam.pos.set(focus.x, focus.y + 0.9, fitDist);
cam.look.copy(focus);

const tmpV = new THREE.Vector3();
const mobBar = $('mobBar');
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  const t = now / 1000;
  last = now;

  updateTweens(dt);
  updateLever(dt);
  machines.forEach(m => m.update(t, dt));
  updatePayout(dt);
  updateCoins(dt);
  updatePuffs(dt);
  for (const id in buttons) {
    const b = buttons[id];
    b.press = Math.max(0, b.press - dt);
    b.cap.position.y = b.press > 0 ? 0.04 : 0.08;
    const idle = state.phase === 'idle';
    b.mat.emissiveIntensity = id === 'spin' && idle ? 0.1 + 0.1 * Math.sin(t * 4) : idle ? 0.08 : 0;
  }

  // 사신 둥실둥실
  if (reaper.visible) {
    updateReaper(t, dt);
  }

  // 자동 레버
  if (state.auto && state.phase === 'idle' && !state.shopOpen && state.credits > 0 && !lever.auto && !lever.dragging) {
    state.autoT += dt;
    if (state.autoT > 0.8) { state.autoT = 0; autoPull(); }
  }

  // 카메라
  const k = 1 - Math.exp(-dt * 3);
  if (cam.mode === 'normal') {
    const par = lever.dragging ? 0 : 1;
    tmpV.set(focus.x + mouse.x * 1.2 * par, focus.y + 0.9 - mouse.y * 0.6 * par, fitDist);
    cam.pos.lerp(tmpV, k);
    cam.look.lerp(focus, k);
  } else if (cam.mode === 'coin') {
    coin.getWorldPosition(tmpV);
    cam.look.lerp(tmpV, Math.min(1, k * 2));
    cam.pos.lerp(tmpV.set(tmpV.x * 0.6, tmpV.y + 0.3, tmpV.z + 3.6), Math.min(1, k * 1.5));
  } else {
    const v = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const d = Math.max(4.8 / v, 4.0 / (v * camera.aspect));
    cam.pos.lerp(tmpV.set(0.3, 2.5, reaper.position.z + d), k);
    cam.look.lerp(tmpV.set(0, 2.0, reaper.position.z), k);
  }
  camera.position.copy(cam.pos);
  if (cam.mode === 'death') {
    const f = cam.fall;
    camera.position.set(cam.pos.x + 0.8 * f, cam.pos.y - (cam.pos.y - 0.5) * f, cam.pos.z - 1.2 * f);
    camera.lookAt(cam.look.x, cam.look.y + 1.2 * f, cam.look.z);
    camera.rotateZ(1.3 * f);
  } else camera.lookAt(cam.look);
  if (state.shake > 0) {
    state.shake -= dt;
    const a = 0.08 * Math.min(1, state.shake);
    camera.position.x += rand(-a, a); camera.position.y += rand(-a, a);
  }

  if (!state.pulled) {
    const s = toScreen(main.group.localToWorld(leverBallWorld(lever.angle)));
    const roomRight = s.x + 190 < innerWidth;
    $('hint').style.transform = roomRight
      ? `translate(${s.x + 28}px, ${s.y - 14}px)`
      : `translate(${clamp(s.x - 150, 8, innerWidth - 170)}px, ${Math.min(s.y + 330, innerHeight - 150)}px)`;
  }
  mobBar.classList.toggle('off', blocked());
  if (bubble.classList.contains('show')) {
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    if (innerWidth < 560) {
      // 좁은 화면: 사신 얼굴을 가리지 않게 아래쪽 가운데
      bubble.style.transform = `translate(${(innerWidth - bw) / 2}px, ${innerHeight - bh - 28}px)`;
    } else {
      const s = toScreen(reaper.localToWorld(tmpV.set(0.75, 3.1 + rbody.position.y, 0.3)));
      bubble.style.transform = `translate(${clamp(s.x + 20, 12, innerWidth - bw - 12)}px, ${clamp(s.y - bh / 2, 70, innerHeight - bh - 12)}px)`;
    }
  }

  effect.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
